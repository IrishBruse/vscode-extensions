on:
    push:
        paths:
            - "ib-acp-ui/package.json"
    workflow_dispatch:
        inputs:
            force:
                description: Publish even if package version is unchanged
                required: false
                default: false
                type: boolean

name: Deploy ib-acp-ui

jobs:
    publish:
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip publish]')
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ib-acp-ui
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 2

            - name: Check version changed
              id: version
              working-directory: .
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
                    echo "Force publish requested"
                    echo "skip=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  current=$(jq -r .version ib-acp-ui/package.json)
                  previous=$(git show HEAD~1:ib-acp-ui/package.json | jq -r .version)
                  if [ "$current" = "$previous" ]; then
                    echo "Version unchanged ($current), skipping publish"
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Version changed ($previous -> $current)"
                    echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/setup-node@v4
              if: steps.version.outputs.skip != 'true'
              with:
                  node-version: "lts/*"

            - run: npm ci
              if: steps.version.outputs.skip != 'true'
              working-directory: .

            - run: npx @vscode/vsce publish --skip-license
              if: steps.version.outputs.skip != 'true'
              env:
                  VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
